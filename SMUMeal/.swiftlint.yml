# SMUMeal SwiftLint Configuration

# ============================================================================
# 포함/제외 경로
# ============================================================================
included:
  - App
  - Core
  - Feature
  - UI

excluded:
  - Tuist
  - Derived
  - "**/*.xcodeproj"
  - "**/*.xcworkspace"
  - "**/Derived/**"
  - "**/*.generated.swift"

# ============================================================================
# 비활성화된 규칙
# ============================================================================
disabled_rules:
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure
  - trailing_whitespace

# ============================================================================
# 선택적 활성화 규칙 (opt-in)
# ============================================================================
opt_in_rules:
  # 코드 품질
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_first_not_nil
  - flatmap_over_map_reduce

  # 안전성
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - discouraged_optional_collection

  # 가독성
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

  # 네이밍
  - file_name

  # 불필요한 코드
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool

  # MARK 주석
  - mark

  # 클로저
  - closure_body_length
  - closure_end_indentation

  # 기타
  - fatal_error_message
  - private_over_fileprivate
  - yoda_condition

# ============================================================================
# 규칙별 상세 설정
# ============================================================================

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k
    - db
    - vm
    - vc
    - ui
    - to
    - at

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

file_length:
  warning: 500
  error: 700
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

closure_body_length:
  warning: 30
  error: 50

function_parameter_count:
  warning: 6
  error: 8
  ignores_default_parameters: true

line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

nesting:
  type_level:
    warning: 3
    error: 5
  function_level:
    warning: 4
    error: 6

force_cast:
  severity: warning

force_try:
  severity: warning

force_unwrapping:
  severity: warning

large_tuple:
  warning: 3
  error: 4

mark:
  severity: warning

todo:
  severity: warning

# ============================================================================
# 커스텀 규칙
# ============================================================================
custom_rules:
  no_print_statement:
    name: "No Print Statement"
    regex: "\\bprint\\s*\\("
    message: "print() 대신 Logger를 사용하세요."
    severity: warning

  fatal_error_usage:
    name: "Fatal Error Usage"
    regex: "\\bfatalError\\s*\\("
    message: "fatalError 대신 적절한 에러 처리를 고려하세요."
    severity: warning

# ============================================================================
# 리포터 설정
# ============================================================================
reporter: "xcode"
